name: Build Android app

# The installable app is built on demand and on every version tag. A debug APK
# can be sideloaded directly; a signed release build is produced only when the
# repository provides a keystore through secrets.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Run regression tests
        working-directory: frontend
        run: npm test
      - name: Build web bundle
        working-directory: frontend
        run: npm run build
      - name: Copy the bundle into the native project
        working-directory: frontend
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: frontend/android
        env:
          CORELINE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: coreline-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Build web bundle
        working-directory: frontend
        run: npm run build
      - name: Copy the bundle into the native project
        working-directory: frontend
        run: npx cap sync android
      - name: Restore the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coreline.jks"
            echo "path=$RUNNER_TEMP/coreline.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret configured; the release build stays unsigned."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK and Play bundle
        working-directory: frontend/android
        env:
          CORELINE_VERSION_CODE: ${{ github.run_number }}
          CORELINE_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "CORELINE ${{ github.ref_name }}" \
            --notes "Android build for ${{ github.ref_name }}. Install the APK directly, or upload the .aab to Google Play." \
            --verify-tag \
            frontend/android/app/build/outputs/apk/release/*.apk \
            frontend/android/app/build/outputs/bundle/release/*.aab
