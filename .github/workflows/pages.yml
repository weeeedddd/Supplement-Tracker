name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run regression tests
        working-directory: frontend
        run: npm test
      - name: Build production app
        working-directory: frontend
        env:
          VITE_BACKEND_URL: https://77.90.30.225
        run: npm run build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint system backend
        working-directory: backend
        run: >-
          python -m ruff check
          app/account_api.py app/api_v1.py app/food_label_api.py app/guild_api.py
          app/integration_app.py app/integration_models.py app/integrations.py app/models.py
          app/push_api.py app/push_service.py app/push_worker.py app/security.py
          app/services/vision.py app/social_api.py
          tests/test_integrations.py tests/test_social_guild_push.py tests/test_vision_label.py
      - name: Test system backend
        working-directory: backend
        run: python -m pytest -q

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, backend]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
