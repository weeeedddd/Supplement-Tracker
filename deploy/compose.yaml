name: coreline

x-coreline-app: &coreline-app
  image: coreline-api:local
  build:
    context: ../backend
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/.env}
    CORS_ORIGINS: ${CORS_ORIGINS:-https://weeeedddd.github.io}
    MEDIA_DIR: /app/media
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  volumes:
    - coreline_media:/app/media
  networks:
    - app
    - database

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coreline}
      POSTGRES_USER: ${POSTGRES_USER:-coreline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - coreline_postgres:/var/lib/postgresql/data
    networks:
      - database

  api:
    <<: *coreline-app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  push-worker:
    <<: *coreline-app
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while true; do
          python -m app.push_worker
          sleep 300
        done

volumes:
  coreline_postgres:
  coreline_media:

networks:
  app:
  database:
    internal: true
